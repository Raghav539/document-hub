version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: documenthub-db
    environment:
      POSTGRES_DB: documenthub
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d documenthub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - documenthub-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: documenthub-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - documenthub-network

  # Django Backend
  django:
    build:
      context: ./backend-django
      dockerfile: Dockerfile
    container_name: documenthub-django
    ports:
      - "8014:8000"  # External: 8014, Internal: 8000
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-your-secret-key-12345
      - DB_NAME=documenthub
      - DB_USER=devuser
      - DB_PASSWORD=devpass123
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8014,http://localhost:8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend-django:/app
    networks:
      - documenthub-network

  # FastAPI Backend
  fastapi:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    container_name: documenthub-fastapi
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://devuser:devpass123@db:5432/documenthub
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend-fastapi:/app
    networks:
      - documenthub-network

volumes:
  postgres_data:

networks:
  documenthub-network:
    driver: bridge
